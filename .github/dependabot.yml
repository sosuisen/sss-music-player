version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # One pull request for all small updates keeps the number of reviews low.
    # A major update stays in its own pull request, because it may break the build.
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    # The JavaFX jars must match the static JavaFX libraries of the native exe.
    # They are updated by hand, together. See ADR 4.
    ignore:
      - dependency-name: org.openjfx:javafx-controls
      - dependency-name: org.openjfx:javafx-media
      - dependency-name: us.hebi.graalvm:jfx-static-libs

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
