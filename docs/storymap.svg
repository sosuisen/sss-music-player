<svg xmlns="http://www.w3.org/2000/svg" width="2350.414" height="1038.88"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="black" flood-opacity="0.2"/></filter></defs><rect width="2350.414" height="1038.88" fill="white"/><text x="16" y="67.44" font-family="sans-serif" font-size="32" font-weight="bold">sss-music-player</text><text x="16" y="113.880005" font-family="sans-serif" font-size="16">2026/10/21</text><text x="16" y="149.88" font-family="sans-serif" font-size="16">PC上に散らばった古い音楽ファイルを整理するアプリ。</text><text x="16" y="185.88" font-family="sans-serif" font-size="16">日常的にシンプルに音楽の聴けるプレイヤーも欲しい。整理アプリと機能的に共通部分が多く、利用する場面も同じであるため、プレイヤー機能も追加した。</text><text x="16" y="221.88" font-family="sans-serif" font-size="16">主なユーザーは開発者自身。長年にわたるCDからのリッピングや、複数のサービスからの購入で大量の音楽ファイルを蓄積してきたコレクター。古いツールで作られたShift_JISの日本語タグを持つファイルも保有。日常的にPCで音楽を聴く。</text><rect id="band-0" x="16" y="242.88" width="2318.414" height="48" fill="#e0efff"/><line x1="16" y1="289.88" x2="2334.414" y2="289.88" stroke="#bedeff" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-1" x="16" y="290.88" width="2318.414" height="68" fill="#e0ffee"/><line x1="16" y1="357.88" x2="2334.414" y2="357.88" stroke="#beffdc" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-2" x="16" y="358.88" width="2318.414" height="168" fill="#ffe0e9"/><line x1="16" y1="525.88" x2="2334.414" y2="525.88" stroke="#ffbed1" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-3" x="16" y="526.88" width="2318.414" height="272" fill="#fff3e0"/><line x1="16" y1="797.88" x2="2334.414" y2="797.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-4" x="16" y="798.88" width="2318.414" height="156" fill="#fffaf3"/><line x1="16" y1="953.88" x2="2334.414" y2="953.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-5" x="16" y="954.88" width="2318.414" height="68" fill="#fff3e0"/><line x1="16" y1="1021.88" x2="2334.414" y2="1021.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><text x="32" y="269.88" font-family="sans-serif" font-size="16" fill="#888888">アクティビティ</text><text x="32" y="317.88" font-family="sans-serif" font-size="16" fill="#888888">タスク</text><text x="32" y="385.88" font-family="sans-serif" font-size="16" fill="#888888">ウォーキングスケルトン</text><text x="32" y="553.88" font-family="sans-serif" font-size="16" fill="#888888">メタデータの編集・利用</text><text x="32" y="825.88" font-family="sans-serif" font-size="16" fill="#888888">プレイ体験向上</text><rect id="card-0" x="233" y="251.88" width="158" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="242" y="271.88" font-family="sans-serif" font-size="16">準備する</text><rect id="card-1" x="233" y="299.88" width="158" height="50" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="242" y="319.88" font-family="sans-serif" font-size="16">音楽ファイルを集</text><text x="242" y="339.88" font-family="sans-serif" font-size="16">める</text><rect id="card-2" x="232" y="366.88" width="160" height="88" rx="6" fill="#ffbed1"/><text x="240" y="385.88" font-family="sans-serif" font-size="16">✅ 全ての音楽フォ</text><text x="240" y="405.88" font-family="sans-serif" font-size="16">ルダーを、1つの指</text><text x="240" y="425.88" font-family="sans-serif" font-size="16">定フォルダー以下</text><text x="240" y="445.88" font-family="sans-serif" font-size="16">に置く</text><rect id="card-3" x="409" y="299.88" width="158" height="50" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="418" y="319.88" font-family="sans-serif" font-size="16">プレイヤーを開く</text><rect id="card-4" x="408" y="366.88" width="160" height="88" rx="6" fill="#ffbed1"/><text x="416" y="385.88" font-family="sans-serif" font-size="16">✅ 指定フォルダー</text><text x="416" y="405.88" font-family="sans-serif" font-size="16">がなければ指定す</text><text x="416" y="425.88" font-family="sans-serif" font-size="16">る</text><rect id="card-5" x="409" y="963.88" width="158" height="50" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-width="2"/><text x="418" y="983.88" font-family="sans-serif" font-size="16">スキャン先フォル</text><text x="418" y="1003.88" font-family="sans-serif" font-size="16">ダーを追加する</text><rect id="card-6" x="584" y="366.88" width="160" height="88" rx="6" fill="#ffbed1"/><text x="592" y="385.88" font-family="sans-serif" font-size="16">✅ 指定フォルダー</text><text x="592" y="405.88" font-family="sans-serif" font-size="16">内のmp3、m4aファ</text><text x="592" y="425.88" font-family="sans-serif" font-size="16">イルをスキャンす</text><text x="592" y="445.88" font-family="sans-serif" font-size="16">る</text><rect id="card-7" x="584" y="534.88" width="160" height="68" rx="6" fill="#ffe6be"/><text x="592" y="553.88" font-family="sans-serif" font-size="16">✅ スキャンした</text><text x="592" y="573.88" font-family="sans-serif" font-size="16">ファイルをキャッ</text><text x="592" y="593.88" font-family="sans-serif" font-size="16">シュする</text><rect id="card-8" x="761" y="299.88" width="158" height="50" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="770" y="319.88" font-family="sans-serif" font-size="16">テーマ変更</text><rect id="card-9" x="760" y="366.88" width="160" height="88" rx="6" fill="#ffbed1"/><text x="768" y="385.88" font-family="sans-serif" font-size="16">✅ ライト・ダーク</text><text x="768" y="405.88" font-family="sans-serif" font-size="16">テーマの変更</text><rect id="card-10" x="937" y="251.88" width="158" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="946" y="271.88" font-family="sans-serif" font-size="16">アーカイブの整理</text><rect id="card-11" x="937" y="299.88" width="158" height="50" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="946" y="319.88" font-family="sans-serif" font-size="16">重複ファイルの検</text><text x="946" y="339.88" font-family="sans-serif" font-size="16">出</text><rect id="card-12" x="936" y="366.88" width="160" height="88" rx="6" fill="#ffbed1"/><text x="944" y="385.88" font-family="sans-serif" font-size="16">✅ ファイル名とサ</text><text x="944" y="405.88" font-family="sans-serif" font-size="16">イズの一致検出</text><rect id="card-13" x="936" y="534.88" width="160" height="68" rx="6" fill="#ffe6be"/><text x="944" y="553.88" font-family="sans-serif" font-size="16">✅ メタデータの一</text><text x="944" y="573.88" font-family="sans-serif" font-size="16">致検出</text><rect id="card-14" x="1113" y="299.88" width="158" height="50" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1122" y="319.88" font-family="sans-serif" font-size="16">検出ファイルの試</text><text x="1122" y="339.88" font-family="sans-serif" font-size="16">聴</text><rect id="card-15" x="1112" y="366.88" width="160" height="88" rx="6" fill="#ffbed1"/><text x="1120" y="385.88" font-family="sans-serif" font-size="16">✅ 再生ボタン追加</text><rect id="card-16" x="1289" y="299.88" width="158" height="50" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1298" y="319.88" font-family="sans-serif" font-size="16">検出ファイルの後</text><text x="1298" y="339.88" font-family="sans-serif" font-size="16">処理</text><rect id="card-17" x="1288" y="366.88" width="160" height="88" rx="6" fill="#ffbed1"/><text x="1296" y="385.88" font-family="sans-serif" font-size="16">✅ ファイルをフォ</text><text x="1296" y="405.88" font-family="sans-serif" font-size="16">ルダーから除去</text><rect id="card-18" x="1288" y="470.88" width="160" height="48" rx="6" fill="#ffbed1"/><text x="1296" y="489.88" font-family="sans-serif" font-size="16">✅ ファイルのある</text><text x="1296" y="509.88" font-family="sans-serif" font-size="16">フォルダーを開く</text><rect id="card-19" x="1465" y="299.88" width="158" height="50" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1474" y="319.88" font-family="sans-serif" font-size="16">メタデータを修正</text><text x="1474" y="339.88" font-family="sans-serif" font-size="16">する</text><rect id="card-20" x="1464" y="534.88" width="160" height="68" rx="6" fill="#ffe6be"/><text x="1472" y="553.88" font-family="sans-serif" font-size="16">✅ アルバム名とア</text><text x="1472" y="573.88" f