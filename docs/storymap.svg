<svg xmlns="http://www.w3.org/2000/svg" width="3997.1094" height="738.88"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="black" flood-opacity="0.2"/></filter></defs><rect width="3997.1094" height="738.88" fill="white"/><text x="16" y="67.44" font-family="sans-serif" font-size="32" font-weight="bold">sss-music-player</text><text x="16" y="113.880005" font-family="sans-serif" font-size="16">2026/10/21</text><text x="16" y="149.88" font-family="sans-serif" font-size="16">PC上に散らばった古い音楽ファイルを整理するアプリ。</text><text x="16" y="185.88" font-family="sans-serif" font-size="16">日常的にシンプルに音楽の聴けるプレイヤーも欲しい。整理アプリと機能的に共通部分が多く、利用する場面も同じであるため、プレイヤー機能も追加した。</text><text x="16" y="221.88" font-family="sans-serif" font-size="16">主なユーザーは開発者自身。長年にわたるCDからのリッピングや、複数のサービスからの購入で大量の音楽ファイルを蓄積してきたコレクター。古いツールで作られたShift_JISの日本語タグを持つファイルも保有。日常的にPCで音楽を聴く。</text><rect id="band-0" x="16" y="242.88" width="3965.1094" height="48" fill="#e0efff"/><line x1="16" y1="289.88" x2="3981.1094" y2="289.88" stroke="#bedeff" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-1" x="16" y="290.88" width="3965.1094" height="48" fill="#e0ffee"/><line x1="16" y1="337.88" x2="3981.1094" y2="337.88" stroke="#beffdc" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-2" x="16" y="338.88" width="3965.1094" height="96" fill="#ffe0e9"/><line x1="16" y1="433.88" x2="3981.1094" y2="433.88" stroke="#ffbed1" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-3" x="16" y="434.88" width="3965.1094" height="144" fill="#fff3e0"/><line x1="16" y1="577.88" x2="3981.1094" y2="577.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-4" x="16" y="578.88" width="3965.1094" height="96" fill="#fffaf3"/><line x1="16" y1="673.88" x2="3981.1094" y2="673.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><rect id="band-5" x="16" y="674.88" width="3965.1094" height="48" fill="#fff3e0"/><line x1="16" y1="721.88" x2="3981.1094" y2="721.88" stroke="#ffe6be" stroke-width="2" stroke-dasharray="6 6"/><text x="32" y="269.88" font-family="sans-serif" font-size="16" fill="#888888">アクティビティ</text><text x="32" y="317.88" font-family="sans-serif" font-size="16" fill="#888888">タスク</text><text x="32" y="365.88" font-family="sans-serif" font-size="16" fill="#888888">ウォーキングスケルトン</text><text x="32" y="461.88" font-family="sans-serif" font-size="16" fill="#888888">メタデータの編集・利用</text><text x="32" y="605.88" font-family="sans-serif" font-size="16" fill="#888888">プレイ体験向上</text><rect id="card-0" x="233" y="251.88" width="469.3125" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="242" y="271.88" font-family="sans-serif" font-size="16">準備する</text><rect id="card-1" x="233" y="299.88" width="469.3125" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="242" y="319.88" font-family="sans-serif" font-size="16">音楽ファイルを集める</text><rect id="card-2" x="232" y="346.88" width="471.3125" height="28" rx="6" fill="#ffbed1"/><text x="240" y="365.88" font-family="sans-serif" font-size="16">✅ 全ての音楽フォルダーを、1つの指定フォルダー以下に置く</text><rect id="card-3" x="720.3125" y="299.88" width="300.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="729.3125" y="319.88" font-family="sans-serif" font-size="16">プレイヤーを開く</text><rect id="card-4" x="719.3125" y="346.88" width="302.41406" height="28" rx="6" fill="#ffbed1"/><text x="727.3125" y="365.88" font-family="sans-serif" font-size="16">✅ 指定フォルダーがなければ指定する</text><rect id="card-5" x="720.3125" y="683.88" width="300.41406" height="30" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-width="2"/><text x="729.3125" y="703.88" font-family="sans-serif" font-size="16">スキャン先フォルダーを追加する</text><rect id="card-6" x="1037.7266" y="346.88" width="444.66406" height="28" rx="6" fill="#ffbed1"/><text x="1045.7266" y="365.88" font-family="sans-serif" font-size="16">✅ 指定フォルダー内のmp3、m4aファイルをスキャンする</text><rect id="card-7" x="1037.7266" y="442.88" width="444.66406" height="28" rx="6" fill="#ffe6be"/><text x="1045.7266" y="461.88" font-family="sans-serif" font-size="16">✅ スキャンしたファイルをキャッシュする</text><rect id="card-8" x="1499.3906" y="299.88" width="252.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1508.3906" y="319.88" font-family="sans-serif" font-size="16">テーマ変更</text><rect id="card-9" x="1498.3906" y="346.88" width="254.41406" height="28" rx="6" fill="#ffbed1"/><text x="1506.3906" y="365.88" font-family="sans-serif" font-size="16">✅ ライト・ダークテーマの変更</text><rect id="card-10" x="1769.8047" y="251.88" width="268.41406" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="1778.8047" y="271.88" font-family="sans-serif" font-size="16">アーカイブの整理</text><rect id="card-11" x="1769.8047" y="299.88" width="268.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="1778.8047" y="319.88" font-family="sans-serif" font-size="16">重複ファイルの検出</text><rect id="card-12" x="1768.8047" y="346.88" width="270.41406" height="28" rx="6" fill="#ffbed1"/><text x="1776.8047" y="365.88" font-family="sans-serif" font-size="16">✅ ファイル名とサイズの一致検出</text><rect id="card-13" x="1768.8047" y="442.88" width="270.41406" height="28" rx="6" fill="#ffe6be"/><text x="1776.8047" y="461.88" font-family="sans-serif" font-size="16">✅ メタデータの一致検出</text><rect id="card-14" x="2056.2188" y="299.88" width="162" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="2065.2188" y="319.88" font-family="sans-serif" font-size="16">検出ファイルの試聴</text><rect id="card-15" x="2055.2188" y="346.88" width="164" height="28" rx="6" fill="#ffbed1"/><text x="2063.2188" y="365.88" font-family="sans-serif" font-size="16">✅ 再生ボタン追加</text><rect id="card-16" x="2236.2188" y="299.88" width="284.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="2245.2188" y="319.88" font-family="sans-serif" font-size="16">検出ファイルの後処理</text><rect id="card-17" x="2235.2188" y="346.88" width="286.41406" height="28" rx="6" fill="#ffbed1"/><text x="2243.2188" y="365.88" font-family="sans-serif" font-size="16">✅ ファイルをフォルダーから除去</text><rect id="card-18" x="2235.2188" y="394.88" width="286.41406" height="28" rx="6" fill="#ffbed1"/><text x="2243.2188" y="413.88" font-family="sans-serif" font-size="16">✅ ファイルのあるフォルダーを開く</text><rect id="card-19" x="2538.6328" y="299.88" width="444.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="2547.6328" y="319.88" font-family="sans-serif" font-size="16">メタデータを修正する</text><rect id="card-20" x="2537.6328" y="442.88" width="446.41406" height="28" rx="6" fill="#ffe6be"/><text x="2545.6328" y="461.88" font-family="sans-serif" font-size="16">✅ アルバム名とアルバムアーティストの編集</text><rect id="card-21" x="2537.6328" y="490.88" width="446.41406" height="28" rx="6" fill="#ffe6be"/><text x="2545.6328" y="509.88" font-family="sans-serif" font-size="16">✅ アルバムアーティストに曲のアーティスト名を自動入力</text><rect id="card-22" x="2537.6328" y="538.88" width="446.41406" height="28" rx="6" fill="#ffe6be"/><text x="2545.6328" y="557.88" font-family="sans-serif" font-size="16">✅ 曲のメタデータ編集</text><rect id="card-23" x="3001.0469" y="251.88" width="156.41406" height="30" rx="6" fill="#bedeff" stroke="#208cff" stroke-width="2"/><text x="3010.0469" y="271.88" font-family="sans-serif" font-size="16">音楽を楽しむ</text><rect id="card-24" x="3001.0469" y="299.88" width="156.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="3010.0469" y="319.88" font-family="sans-serif" font-size="16">アルバムを選ぶ</text><rect id="card-25" x="3000.0469" y="442.88" width="158.41406" height="28" rx="6" fill="#ffe6be"/><text x="3008.0469" y="461.88" font-family="sans-serif" font-size="16">✅ リストから探す</text><rect id="card-26" x="3000.0469" y="490.88" width="158.41406" height="28" rx="6" fill="#ffe6be"/><text x="3008.0469" y="509.88" font-family="sans-serif" font-size="16">✅ 検索窓から探す</text><rect id="card-27" x="3175.461" y="299.88" width="348.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="3184.461" y="319.88" font-family="sans-serif" font-size="16">再生・停止する</text><rect id="card-28" x="3174.461" y="442.88" width="350.41406" height="28" rx="6" fill="#ffe6be"/><text x="3182.461" y="461.88" font-family="sans-serif" font-size="16">✅ 再生・停止ボタン</text><rect id="card-29" x="3174.461" y="490.88" width="350.41406" height="28" rx="6" fill="#ffe6be"/><text x="3182.461" y="509.88" font-family="sans-serif" font-size="16">✅ 早送り、巻き戻し、一時停止</text><rect id="card-30" x="3174.461" y="538.88" width="350.41406" height="28" rx="6" fill="#ffe6be"/><text x="3182.461" y="557.88" font-family="sans-serif" font-size="16">✅ 一曲リピート、アルバムリピートのトグル</text><g id="card-31-shadow" filter="url(#shadow)"><rect id="card-31" x="3175.461" y="587.88" width="348.41406" height="30" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-width="2"/></g><text x="3184.461" y="607.88" font-family="sans-serif" font-size="16">⬜ プレイリストから再生</text><rect id="card-32" x="3175.461" y="635.88" width="348.41406" height="30" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-width="2"/><text x="3184.461" y="655.88" font-family="sans-serif" font-size="16">アルバム名ダブルクリックで先頭曲から再生</text><rect id="card-33" x="3541.875" y="299.88" width="252.41406" height="30" rx="6" fill="#beffdc" stroke="#20ff85" stroke-width="2"/><text x="3550.875" y="319.88" font-family="sans-serif" font-size="16">再生中のアルバムを整理する</text><rect id="card-34" x="3540.875" y="442.88" width="254.41406" height="28" rx="6" fill="#ffe6be"/><text x="3548.875" y="461.88" font-family="sans-serif" font-size="16">✅ メタデータを修正する</text><rect id="card-35" x="3540.875" y="490.88" width="254.41406" height="28" rx="6" fill="#ffe6be"/><text x="3548.875" y="509.88" font-family="sans-serif" font-size="16">✅ アルバムのフォルダーを開く</text><g id="card-36-shadow" filter="url(#shadow)"><rect id="card-36" x="3812.289" y="587.88" width="159.82031" height="30" rx="6" fill="#ffe6be" stroke="#ffa920" stroke-